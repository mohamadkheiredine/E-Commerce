name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A new push to the same branch cancels the run for the previous commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret values only. The API validates these at boot; CI would otherwise fail
  # before a single test runs.
  NODE_ENV: test
  DATABASE_URL: file:./ci.db
  JWT_SECRET: ci-only-secret-not-used-anywhere-real-0123456789abcdef
  WEB_ORIGIN: http://localhost:3000
  API_URL: http://localhost:4000/api/v1
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:deploy --workspace @ecom/api

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
